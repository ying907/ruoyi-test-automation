name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发按钮，调试集成环境时专用

jobs:
  api-regression:
    name: 拉起被测系统并运行接口回归
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 安装 Java 21（与本地运行环境一致）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 克隆 RuoYi-Vue 源码
        run: git clone --depth 1 https://github.com/yangzongzhuan/RuoYi-Vue.git /tmp/ruoyi

      - name: 安装 mysql / redis 客户端
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client redis-tools

      - name: 初始化数据库（建表 + quartz）
        run: |
          mysql -h 127.0.0.1 -uroot -proot ry-vue < /tmp/ruoyi/sql/ry_*.sql
          mysql -h 127.0.0.1 -uroot -proot ry-vue < /tmp/ruoyi/sql/quartz.sql

      - name: 对齐数据源配置（不信任上游默认值，强制写入本环境值）
        run: |
          CFG=/tmp/ruoyi/ruoyi-admin/src/main/resources/application-druid.yml
          sed -i -E 's#localhost:3306/[a-zA-Z0-9_-]+#localhost:3306/ry-vue#' $CFG
          sed -i -E 's/^(([[:space:]]*)username:).*/\1 root/' $CFG
          sed -i -E 's/^(druid:)/druid:/' $CFG
          sed -i -E '/master:/,/slave3:/ s/^(  ([[:space:]]*)password:).*/\1 root/' $CFG
          grep -E "url:|username:|password:" $CFG

      - name: 打包后端
        run: mvn -B -f /tmp/ruoyi/pom.xml package -DskipTests -q

      - name: 启动后端并等待就绪（最多 2 分钟）
        run: |
          nohup java -jar /tmp/ruoyi/ruoyi-admin/target/ruoyi-admin.jar > /tmp/ruoyi.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/captchaImage || true)
            if [ "$code" = "200" ]; then echo "后端就绪 (第 $i 轮探测)"; break; fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "后端启动失败，最后 100 行日志："
            tail -100 /tmp/ruoyi.log
            exit 1
          fi

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行接口回归（8 条用例）
        env:
          API_BASE_URL: http://127.0.0.1:8080
          REDIS_CLI: /usr/bin/redis-cli
          LOGIN_USER: admin
          LOGIN_PASS: admin123
          EVIDENCE_DIR: /tmp/screenshots
        run: pytest tests/api -v

      - name: 归档运行结果（失败也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output
          path: |
            reports/
          if-no-files-found: ignore
